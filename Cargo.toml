[package]
name = "orbit"
version = "0.1.0"
edition = "2021"
description = "Overlay estilo Game Bar para Linux, aberto pelo botão Guide do controle"
license = "GPL-3.0-or-later"
repository = "https://github.com/RafaelMendes1407/orbit"
readme = "README.md"
keywords = ["gamepad", "overlay", "linux", "gtk4", "wayland"]

[features]
default = ["layer-shell"]
# Overlay de verdade (por cima de jogos em tela cheia) via wlr-layer-shell.
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = { version = "0.9", optional = true }
evdev = "0.13"
async-channel = "2"
serde_json = "1"
libc = "0.2"
gio-unix = "0.22"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
